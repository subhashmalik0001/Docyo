name: macOS build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install media test dependency
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Website checks
        run: |
          node scripts/test-site.cjs
          node scripts/test-desktop-site.cjs
          node scripts/test-demo.cjs
          node scripts/test-analytics.cjs
      - name: Test
        run: ./scripts/test.sh
      - name: Build
        run: ./scripts/build-app.sh
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Docyo.app" dist/Docyo-macOS.zip
          bash scripts/build-dmg.sh "dist/Docyo.app" dist/Docyo-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Docyo-macOS
          path: |
            dist/Docyo-macOS.dmg
            dist/Docyo-macOS.zip
