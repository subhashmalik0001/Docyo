name: Publish versioned release
on:
  push:
    branches: [main]
    paths: [scripts/build-app.sh]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install media test dependency
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Build and test
        run: |
          ./scripts/test.sh
          ./scripts/build-app.sh
      - name: Verify trial bundle integrity
        run: |
          codesign --verify --deep --strict --verbose=2 'dist/Docyo.app'
          test -x 'dist/Docyo.app/Contents/MacOS/Docyo'
          plutil -lint 'dist/Docyo.app/Contents/Info.plist'
      - name: Package and publish new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'dist/Docyo.app/Contents/Info.plist')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'This version is already published; increment the version to publish changes.'
            exit 0
          fi
          ditto -c -k --sequesterRsrc --keepParent 'dist/Docyo.app' "dist/Docyo-$VERSION-macOS.zip"
          shasum -a 256 "dist/Docyo-$VERSION-macOS.zip" > dist/SHA256SUMS.txt
          gh release create "v$VERSION" "dist/Docyo-$VERSION-macOS.zip" dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Docyo $VERSION · Local-first file converter" --notes "Docyo release for macOS 26+. Ad-hoc signed. Download the ZIP, unzip, and move Docyo to Applications. Installation and documentation: https://subhashmalik0001.github.io/Docyo/#download ."
