name: Windows and Linux desktop
on:
  push:
    branches: [main]
    paths: ['Desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['Desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Desktop
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt and media dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 ffmpeg libavcodec-extra
      - name: Windows media test dependency
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install pinned desktop dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt pyinstaller==6.22.3
      - name: Conversion, safety and UI tests
        run: python -m unittest discover -s tests -v
      - name: Package portable app with source and licenses
        run: python package.py
      - name: Packaged smoke tests
        run: python smoke_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            Desktop/dist/Docyo-*.zip
            Desktop/dist/Docyo-*.tar.gz
            Desktop/dist/Docyo-*.sha256
          if-no-files-found: error
  publish:
    needs: desktop
    if: "always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish or update desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d release-assets ] && [ "$(ls -A release-assets 2>/dev/null)" ]; then
            gh release upload desktop-v0.2.0 release-assets/* --clobber || gh release create desktop-v0.2.0 release-assets/* --target "$GITHUB_SHA" --prerelease --title 'Docyo 0.2.0 · Windows and Linux Desktop' --notes-file Desktop/RELEASE.md
          fi
