name: Windows and Linux desktop
on:
  push:
    branches: [main]
    paths: ['Desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['Desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Desktop
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows media test dependency
        run: choco install ffmpeg --no-progress -y
      - name: Install dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt pyinstaller==6.22.3
      - name: Unit and UI tests
        run: python -m unittest discover -s tests -v
      - name: Package portable app
        run: python package.py
      - name: Packaged smoke tests
        run: python smoke_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-Windows
          path: |
            Desktop/dist/Docyo-*.zip
            Desktop/dist/Docyo-*.sha256
          if-no-files-found: error
      - name: Publish Windows release asset
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload desktop-v0.2.0 (Get-Item Desktop/dist/Docyo-*.zip).FullName (Get-Item Desktop/dist/Docyo-*.sha256).FullName --clobber
        shell: pwsh

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Desktop
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 ffmpeg libavcodec-extra
      - name: Install dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt pyinstaller==6.22.3
      - name: Unit and UI tests
        run: python -m unittest discover -s tests -v
      - name: Package portable app
        run: python package.py
      - name: Packaged smoke tests
        run: python smoke_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-Linux
          path: |
            Desktop/dist/Docyo-*.tar.gz
            Desktop/dist/Docyo-*.sha256
          if-no-files-found: error
      - name: Publish Linux release asset
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload desktop-v0.2.0 Desktop/dist/Docyo-*.tar.gz Desktop/dist/Docyo-*.sha256 --clobber || true
